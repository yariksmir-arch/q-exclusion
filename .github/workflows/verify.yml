name: Public verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows-full:
    runs-on: windows-2022
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -B research/verification/verify_public.py
      - run: python -B research/regression/canonical_regression.py
      - run: python -B research/regression/portable_regression.py
      - run: python -B research/verification/open_histories_check.py
      - run: python -B research/verification/verify_public.py
      - run: git diff --exit-code
  python-portability:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -B research/verification/verify_public.py
      - run: python -B research/regression/portable_regression.py
      - run: python -B research/verification/open_histories_check.py
      - run: python -B research/verification/verify_public.py
      - run: git diff --exit-code
