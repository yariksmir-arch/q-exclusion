name: Public verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows-full:
    runs-on: windows-2022
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node.js 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0; Node.js 24
        with:
          python-version: '3.12'
      - run: python -B research/verification/verify_public.py
      - run: python -B research/regression/canonical_regression.py
      - run: python -B research/regression/portable_regression.py
      - run: python -B research/verification/open_histories_check.py
      - run: python -B research/verification/verify_public.py
      - run: git diff --exit-code
  python-portability:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node.js 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0; Node.js 24
        with:
          python-version: '3.12'
      - run: python -B research/verification/verify_public.py
      - run: python -B research/regression/portable_regression.py
      - run: python -B research/verification/open_histories_check.py
      - run: python -B research/verification/verify_public.py
      - run: git diff --exit-code
